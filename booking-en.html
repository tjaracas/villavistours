<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Tour - VillaVis</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800">

<header class="bg-white shadow p-4 flex justify-between items-center">
<h1 class="text-xl font-bold">VillaVis - Tour Booking</h1>
<nav>
<a href="index.html" class="text-blue-600 hover:underline mx-2">Home</a>
</nav>
</header>

<main class="max-w-3xl mx-auto py-10 px-4">

<h2 id="tourTitle" class="text-3xl font-semibold mb-6">
Reserve Your Tour
</h2>

<form action="https://formspree.io/f/mzdjvpej" method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">

<!-- Name -->
<div>
<label class="block font-medium">Name</label>
<input type="text" name="name" required class="mt-1 w-full border rounded px-3 py-2">
</div>

<!-- Email -->
<div>
<label class="block font-medium">Email</label>
<input type="email" name="_replyto" required class="mt-1 w-full border rounded px-3 py-2">
</div>

<!-- Tour selection -->
<div>
<label class="block font-medium">Select Tour</label>

<select id="tour" name="tour" class="mt-1 w-full border rounded px-3 py-2">

<option value="">-- Please choose an option --</option>

<option value="spanishwater">
Sightseeing Tour (no drinks included)
</option>

<option value="spanishwaterwithfood">
Sightseeing All-In Tour (drinks included)
</option>

<option value="private">
Private Charter (drinks included)
</option>

</select>

</div>

<!-- Date -->
<div>
<label class="block font-medium">Preferred Date</label>
<input type="date" name="date" required class="mt-1 w-full border rounded px-3 py-2">
</div>

<!-- Number of people -->
<div>
<label class="block font-medium">Number of Guests</label>
<input type="number" id="people" name="people" min="1" required class="mt-1 w-full border rounded px-3 py-2">
</div>

<!-- DRINK SECTION -->
<div id="drinksSection" class="space-y-4">

<div class="bg-blue-50 p-4 rounded">

<p>
<strong>Included drinks:</strong>
<span id="included">0</span>
</p>

<p class="text-sm text-gray-600">
Each guest receives 2 drinks included.
</p>

</div>

<div>

<label class="block font-medium mb-2">Select Drinks</label>

<div class="grid grid-cols-2 gap-3">

<label>Amstel Bright
<input type="number" class="drink w-full border rounded px-2 py-1" name="amstel" value="0" min="0">
</label>

<label>Coca Cola
<input type="number" class="drink w-full border rounded px-2 py-1" name="coke" value="0" min="0">
</label>

<label>Sprite
<input type="number" class="drink w-full border rounded px-2 py-1" name="sprite" value="0" min="0">
</label>

<label>Lemon Ice Tea
<input type="number" class="drink w-full border rounded px-2 py-1" name="lemon_ice_tea" value="0" min="0">
</label>

<label>Peach Ice Tea
<input type="number" class="drink w-full border rounded px-2 py-1" name="peach_ice_tea" value="0" min="0">
</label>

<label>Ginger Ale
<input type="number" class="drink w-full border rounded px-2 py-1" name="ginger_ale" value="0" min="0">
</label>

<label>Sinas
<input type="number" class="drink w-full border rounded px-2 py-1" name="sinas" value="0" min="0">
</label>

<label>Cassis
<input type="number" class="drink w-full border rounded px-2 py-1" name="cassis" value="0" min="0">
</label>

</div>

<p class="mt-3">
Selected drinks:
<strong id="selected">0</strong>
</p>

<p id="warning" class="text-red-600 hidden">
You selected more drinks than included. Extra drinks will be charged afterwards.
</p>

</div>

</div>

<!-- Extra info -->
<div>
<label class="block font-medium">Additional Information</label>
<textarea name="message" rows="4" class="mt-1 w-full border rounded px-3 py-2"></textarea>
</div>

<button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
Send Booking Request
</button>

</form>

</main>

<footer class="text-center text-gray-500 text-sm py-6">
© 2025 VillaVis Tours Curacao
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const tourParam = params.get('tour');

const drinksSection = document.getElementById("drinksSection");
const tourSelect = document.getElementById("tour");
const tourTitle = document.getElementById("tourTitle");

function updateTour(){

let selectedTour = tourSelect.value;

if(selectedTour === "spanishwater"){

drinksSection.style.display = "none";
tourTitle.innerText = "Sightseeing Tour";

}

else if(selectedTour === "spanishwaterwithfood"){

drinksSection.style.display = "block";
tourTitle.innerText = "Sightseeing All-In Tour";

}

else if(selectedTour === "private"){

drinksSection.style.display = "block";
tourTitle.innerText = "Private Charter";

}

}

if(tourParam){

tourSelect.value = tourParam;
updateTour();

}

tourSelect.addEventListener("change", updateTour);


const people = document.getElementById("people");
const drinks = document.querySelectorAll(".drink");
const included = document.getElementById("included");
const selected = document.getElementById("selected");
const warning = document.getElementById("warning");

function updateDrinks(){

let p = parseInt(people.value) || 0;
let inc = p * 2;

included.textContent = inc;

let total = 0;

drinks.forEach(d=>{
total += parseInt(d.value) || 0;
});

selected.textContent = total;

if(total > inc){
warning.classList.remove("hidden");
}else{
warning.classList.add("hidden");
}

}

people.addEventListener("input", updateDrinks);

drinks.forEach(d=>{
d.addEventListener("input", updateDrinks);
});

</script>

</body>
</html>
